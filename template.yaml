AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: AWS Sam Backend for Tower

Parameters:
  AuthUrl:
    Description: The url to check the basic auth tokens against
    Type: String
  AllowOrigin:
    Description: Value for the Access-Control-Allow-Origin CORS-Header
    Default: ""
    Type: String
  StageName:
    Description: The name for the stage to create
    Default: "Prod"
    Type: String
  CommunicationServicesEndpoint:
    Description: The Azure Communication Services Endpoint to use
    Default: ""
    Type: String
  CommunicationServicesAccesskey:
    Description: The access key to use to connect to Azure Communication Services
    Default: ""
    Type: String
  Hours:
    Description: The regular opening hours of the service
    Default: ""
    Type: String
  ExtraHours:
    Description: Opening hours that apply in addition to the regular opening hours
    Default: ""
    Type: String
  Holidays:
    Description: Days where the normal opening hours don't apply
    Default: ""
    Type: String
  HoursDescription:
    Description: Human-readable description for the opening hours.
    Default: ""
    Type: String
  Tz:
    Description: The time zone to use for the opening hours
    Default: ""
    Type: String
  MailFromAddress:
    Description: >-
      The from-address to use when sending confirmation e-mails. Either a bare address (addr@domain) or a
      'Display Name <addr@domain>' form. Leave empty to disable e-mail sending entirely. Must be on the domain
      specified by MailDomain.
    Default: ""
    Type: String
  MailDomain:
    Description: >-
      The domain to use for sending confirmation e-mails. An SES domain identity is created for this domain, with
      Easy DKIM and a custom MAIL FROM subdomain. The DNS records that need to be added for verification are
      published as stack outputs. Leave empty to disable e-mail sending entirely (no SES identity is created in
      that case). Must match the domain part of MailFromAddress.
    Default: ""
    Type: String
  SourceUrl:
    Description: >-
      The url where the source code for the current deployment can be found.
      Required for legal reasons.
    Default: ""
    Type: String

Conditions:
  HasMailDomain: !Not [!Equals [!Ref MailDomain, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        ASSISTANCE_REQUESTS_TABLE_NAME: !Ref AssistanceRequests
        CALL_RECORDS_TABLE_NAME: !Ref CallRecords
        COMMUNICATION_USER_IDS_TABLE_NAME: !Ref CommunicationUserIds
        USER_PROFILES_TABLE_NAME: !Ref UserProfiles
        AUTH_URL: !Ref AuthUrl
        COMMUNICATION_SERVICES_ENDPOINT: !Ref CommunicationServicesEndpoint
        COMMUNICATION_SERVICES_ACCESSKEY: !Ref CommunicationServicesAccesskey
        HOURS: !Ref Hours
        EXTRA_HOURS: !Ref ExtraHours
        HOLIDAYS: !Ref Holidays
        HOURS_DESCRIPTION: !Ref HoursDescription
        TZ: !Ref Tz
        UPLOAD_BUCKET: !Ref UploadBucket
        MAIL_FROM_ADDRESS: !Ref MailFromAddress
        SOURCE_URL: !Ref SourceUrl
  Api:
    # Workaround for https://github.com/aws/serverless-application-model/issues/191
    OpenApiVersion: 3.0.1

Resources:
  TowerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Auth:
        DefaultAuthorizer: BasicAuthLambdaTokenAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          BasicAuthLambdaTokenAuthorizer:
            FunctionArn: !GetAtt BasicAuthLambda.Arn
      Cors:
        AllowMethods: "'POST, GET'"
        AllowOrigin: !Sub
          - "'${Origin}'"
          - Origin: !Ref AllowOrigin
        MaxAge: "'600'"
        AllowCredentials: true
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              WWW-Authenticate: "'Basic'"
          ResponseTemplates:
            "application/json": {"message": "Unauthorized"}
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - !Ref AllowOrigin
      LifecycleConfiguration:
        Rules:
          - Id: DeletionRule
            Status: Enabled
            ExpirationInDays: 1
  AssistanceRequests:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "Username"
          AttributeType: "S"
        - AttributeName: "DateTime"
          AttributeType: "S"
        - AttributeName: "PartitionKey"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: "Username"
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: "DateTime"
          KeySchema:
            - AttributeName: "PartitionKey"
              KeyType: HASH
            - AttributeName: "DateTime"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: "TTL"
        Enabled: true
  CallRecords:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "Meeting"
          AttributeType: "S"
        - AttributeName: "Caller"
          AttributeType: "S"
        - AttributeName: "Assistant"
          AttributeType: "S"
        - AttributeName: "StartDateTime"
          AttributeType: "S"
        - AttributeName: "AcceptDateTime"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: "Meeting"
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: "Assistant"
          KeySchema:
            - AttributeName: "Assistant"
              KeyType: HASH
            - AttributeName: "AcceptDateTime"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: "Caller"
          KeySchema:
            - AttributeName: "Caller"
              KeyType: HASH
            - AttributeName: "StartDateTime"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  CommunicationUserIds:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "Username"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: "Username"
          KeyType: HASH
  UserProfiles:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: "Username"
          AttributeType: "S"
        - AttributeName: "Email"
          AttributeType: "S"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: "Username"
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: "Email"
          KeySchema:
            - AttributeName: "Email"
              KeyType: HASH
          Projection:
            ProjectionType: ALL
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasMailDomain
    Properties:
      EmailIdentity: !Ref MailDomain
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Sub "bounces.${MailDomain}"
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
  TowerBackendIndexLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.indexHandler
      CodeUri: build/
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /
            Method: GET
  TowerBackendRegisterUserLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.registerUserHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfiles
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /registerUser
            Method: POST
  TowerBackendGetUserLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getUserHandler
      CodeUri: build/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfiles
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /getUser
            Method: POST
  TowerBackendUpdateUserLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.updateUserHandler
      CodeUri: build/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfiles
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /updateUser
            Method: POST
  TowerBackendRequestAssistanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requestAssistanceHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssistanceRequests
        - DynamoDBCrudPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfiles
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /requestAssistance
            Method: POST
  TowerBackendAwaitAssistanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.awaitAssistanceHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssistanceRequests
        - DynamoDBCrudPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfiles
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /awaitAssistance
            Method: POST
  TowerBackendCancelAssistanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.cancelAssistanceHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssistanceRequests
        - DynamoDBCrudPolicy:
            TableName: !Ref CallRecords
      Events:
        Api1:
          Type: Api
          Properties:
            Auth:
              Authorizer: NONE
            RestApiId: !Ref TowerApi
            Path: /cancelAssistance
            Method: POST
  TowerBackendAssistanceTokenLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.assistanceTokenHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfiles
      Events:
        Api1:
          Type: Api
          Properties:
            RestApiId: !Ref TowerApi
            Path: /assistanceToken
            Method: GET
  TowerBackendOfferAssistanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.offerAssistanceHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssistanceRequests
      Events:
        Api1:
          Type: Api
          Properties:
            RestApiId: !Ref TowerApi
            Path: /offerAssistance
            Method: GET
  TowerBackendBeginAssistanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.beginAssistanceHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssistanceRequests
        - DynamoDBCrudPolicy:
            TableName: !Ref CallRecords
        - DynamoDBCrudPolicy:
            TableName: !Ref CommunicationUserIds
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfiles
      Events:
        Api1:
          Type: Api
          Properties:
            RestApiId: !Ref TowerApi
            Path: /beginAssistance
            Method: POST
  TowerBackendEndAssistanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.endAssistanceHandler
      CodeUri: build/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallRecords
      Events:
        Api1:
          Type: Api
          Properties:
            RestApiId: !Ref TowerApi
            Path: /endAssistance
            Method: POST
  TowerBackendCreateImageUploadUrl:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.createImageUploadUrlHandler
      CodeUri: build/
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        Api1:
          Type: Api
          Properties:
            RestApiId: !Ref TowerApi
            Path: /createImageUploadUrl
            Method: POST
  TowerBackendCreateImageDownloadUrl:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.createImageDownloadUrlHandler
      CodeUri: build/
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
      Events:
        Api1:
          Type: Api
          Properties:
            RestApiId: !Ref TowerApi
            Path: /createImageDownloadUrl
            Method: POST
  BasicAuthLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/
      Handler: handlers.authHandler
Outputs:
  ApiURL:
    Description: "API endpoint URL for Prod environment"
    Value: !Sub "https://${TowerApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/"
  MailDkimRecord1:
    Description: "DKIM CNAME record 1 -- add to DNS so SES can sign outgoing mail"
    Condition: HasMailDomain
    Value: !Sub "${MailIdentity.DkimDNSTokenName1}. IN CNAME ${MailIdentity.DkimDNSTokenValue1}."
  MailDkimRecord2:
    Description: "DKIM CNAME record 2 -- add to DNS so SES can sign outgoing mail"
    Condition: HasMailDomain
    Value: !Sub "${MailIdentity.DkimDNSTokenName2}. IN CNAME ${MailIdentity.DkimDNSTokenValue2}."
  MailDkimRecord3:
    Description: "DKIM CNAME record 3 -- add to DNS so SES can sign outgoing mail"
    Condition: HasMailDomain
    Value: !Sub "${MailIdentity.DkimDNSTokenName3}. IN CNAME ${MailIdentity.DkimDNSTokenValue3}."
  MailFromMxRecord:
    Description: "Custom MAIL FROM MX record -- add to DNS for SPF/DMARC alignment"
    Condition: HasMailDomain
    Value: !Sub "bounces.${MailDomain}. IN MX 10 feedback-smtp.${AWS::Region}.amazonses.com."
  MailFromSpfRecord:
    Description: "Custom MAIL FROM SPF record -- add to DNS for SPF/DMARC alignment"
    Condition: HasMailDomain
    Value: !Sub 'bounces.${MailDomain}. IN TXT "v=spf1 include:amazonses.com -all"'
  MailSpfRecord:
    Description: "Recommended SPF record on the from-domain"
    Condition: HasMailDomain
    Value: !Sub '${MailDomain}. IN TXT "v=spf1 include:amazonses.com -all"'
  MailDmarcRecord:
    Description: "Recommended DMARC record on the from-domain (tune rua= so reports go to a mailbox that exists)"
    Condition: HasMailDomain
    Value: !Sub '_dmarc.${MailDomain}. IN TXT "v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@${MailDomain}"'
